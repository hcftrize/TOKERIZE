name: Update Canton News

on:
  # Triggered by cron-job.org hitting the GitHub API's workflow_dispatch
  # endpoint once a day, same pattern as the rest of the TOKERIZE workflows —
  # no native schedule: here, so there's only one place (cron-job.org) that
  # controls timing for this job.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run scraper
        run: python scripts/scrape_cantonnews.py

      - name: Commit and push to dev
        run: |
          git config user.name  "cantonnews-bot"
          git config user.email "bot@tokerize.com"
          git add canton-ecosystem/news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            COUNT=$(python -c "import json; print(json.load(open('canton-ecosystem/news.json'))['count'])")
            git commit -m "chore(data): cantonnews — $COUNT articles ($(date -u +%Y-%m-%d))"
            git push origin dev
          fi

      # No manual review step here on purpose: news.json is meant to always
      # mirror exactly what's live on cantonnews.org, so every successful
      # scrape auto-promotes straight to main. The scraper's own safety
      # valve (abort on a suspicious article-count drop) is what protects
      # main from a broken/partial scrape — see scrape_cantonnews.py.
      - name: Push data file to main
        run: |
          git fetch origin main
          git checkout main
          git checkout dev -- canton-ecosystem/news.json
          git add canton-ecosystem/news.json
          git diff --staged --quiet || git commit -m "chore(data): cantonnews — sync to main $(date -u +%Y-%m-%d)"
          git push origin main
