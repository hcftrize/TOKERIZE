name: Generate Canton News Weekly Article

# Triggered externally (cron-job.org, same pattern as the rest of the
# scraping/digest workflows) every Monday morning via workflow_dispatch —
# no native `schedule:` here on purpose, matching the repo's convention.
#
# generate_cantonnews_articles.py does a full rebuild of every COMPLETE
# week found in canton-ecosystem/news.json each time it runs, so the very
# first run bootstraps every missing week in one go, and every following
# Monday run just adds the one week that became complete since last time —
# nothing special to do for "catch up" if a run is ever missed.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the Canton News catalog (news/cantonarticles.json) from canton-ecosystem/news.json
        run: python scripts/generate_cantonnews_articles.py

      - name: Generate static pages (all collections)
        run: python scripts/generate_news.py

      - name: Commit and push to dev
        run: |
          git config user.name  "cantonnews-bot"
          git config user.email "bot@tokerize.com"
          git add news/cantonarticles.json news/canton/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: generate Canton News weekly article [skip ci]"
            git push origin dev
          fi

      # No manual review step here on purpose, same reasoning as
      # reindex-cantonnews.yml: the catalog and pages are fully derived
      # from canton-ecosystem/news.json by a deterministic script, so
      # every successful run auto-promotes straight to main.
      - name: Push catalog + pages to main
        run: |
          git fetch origin main
          git checkout main
          git checkout dev -- news/cantonarticles.json news/canton/
          git add news/cantonarticles.json news/canton/
          git diff --staged --quiet || git commit -m "chore: generate Canton News weekly article — sync to main $(date -u +%Y-%m-%d) [skip ci]"
          git push origin main
