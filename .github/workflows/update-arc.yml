name: Update Arc Ecosystem

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run scraper (diff mode — new entities only)
        run: python scripts/scrape_arc.py --diff

      - name: Check for changes
        id: changes
        run: |
          # git diff ignores untracked files — on the very first run
          # arcentities.json doesn't exist in the repo yet, so a plain
          # `git diff --quiet` would silently see "no changes" and skip the
          # commit. git status --porcelain catches both a brand-new file
          # and a modified tracked one.
          [ -n "$(git status --porcelain arc-ecosystem/arcentities.json)" ] && echo "changed=true" >> $GITHUB_OUTPUT || true
          [ -f HANDLE-THIS-BEFORE-PULL/arc_missing_entities.txt ] && echo "changed=true" >> $GITHUB_OUTPUT || true

      - name: Commit and push if changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "arc-bot"
          git config user.email "bot@tokerize.com"
          # Always add arcentities.json
          git add arc-ecosystem/arcentities.json
          # Add missing entities report if present
          git add HANDLE-THIS-BEFORE-PULL/arc_missing_entities.txt 2>/dev/null || true
          # Add only NEW logo files (untracked), never modify existing ones
          git add arc-ecosystem/logos/
          git diff --cached --name-only arc-ecosystem/logos/ | while read f; do
            git show HEAD:"$f" > /dev/null 2>&1 && git restore --staged "$f" || true
          done
          TIMESTAMP=$(date +"%Y-%m-%d")
          COUNT=$(python -c "import json; data=json.load(open('arc-ecosystem/arcentities.json')); print(len(data))")
          git commit -m "chore: update Arc ecosystem — $COUNT entities ($TIMESTAMP)" || echo "Nothing to commit"
          git push origin dev
