name: Generate News Pages

on:
  push:
    branches: [main, dev]
    paths:
      - 'news/tokerizearticles.json'
      - 'news/cantonarticles.json'
      - 'news/trizearticles.json'
      - 'templates/article-template.html'
      - 'scripts/generate_news.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate static news pages (all collections)
        run: python scripts/generate_news.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/
          git diff --staged --quiet && echo "No changes to commit." || git commit -m "chore: regenerate news pages from catalog JSON [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
