name: Update SV Locking Data

on:
  schedule:
    # Every day at 06:00 UTC (after Lighthouse updates)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SV locking scraper
        run: python scripts/scrape_sv_locking.py

      - name: Commit & push JSON files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rize-data-hub/sv-locking.json rize-data-hub/locking-history.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update sv-locking data $(date -u +%Y-%m-%d)"
          git push
