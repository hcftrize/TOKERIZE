name: Post Canton News Digest

on:
  # Triggered by cron-job.org (or whatever fires your other TOKERIZE
  # workflows) hitting the GitHub API's workflow_dispatch endpoint once a
  # day at 12:00 Europe/Paris. No schedule: here — the external cron
  # already handles the timezone/DST side, so there's no need to also run
  # this hourly and self-gate on the time. Running it by hand any other
  # time just posts the digest again, on purpose.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx

      - name: Post digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CANTONNEWS_DIGEST_CHAT_ID: ${{ secrets.CANTONNEWS_DIGEST_CHAT_ID }}
          CANTONNEWS_DIGEST_THREAD_IDS: ${{ secrets.CANTONNEWS_DIGEST_THREAD_IDS }}
        run: python scripts/post_cantonnews_digest.py

      - name: Commit digest state
        # Tracks the message_id(s) of the digest just posted, so tomorrow's run
        # knows what to delete before reposting (see post_cantonnews_digest.py
        # docstring). Committed even if the "Post digest" step above failed
        # midway, so any messages that DID send are still remembered.
        if: always()
        run: |
          git config user.name  "tokerize-bot"
          git config user.email "bot@tokerize.com"
          git add canton-ecosystem/digest-state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "chore(digest): update message state $(date -u +%Y-%m-%d)"
            git push origin main
          fi
